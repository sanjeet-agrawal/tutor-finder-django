{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm">

            <h3 class="text-center mb-3">Edit Profile</h3>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-success w-100">
                    Save Changes
                </button>
            </form>

        </div>
    </div>
</div>

{% endblock %}
