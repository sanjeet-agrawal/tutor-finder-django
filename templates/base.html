<!DOCTYPE html>
<html>
<head>
    <title>My Tutor Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">MyTutor</span>

    <div>
        <a href="/tutors/" class="btn btn-outline-light btn-sm">Home</a>
        <a href="/bookings/tutor-bookings/" class="btn btn-outline-light btn-sm">My Bookings</a>
        <span class="text-white mx-2">Hello {{ request.user.username }}</span>
        <form action="/logout/" method="POST" style="display:inline;">
        <a href="/accounts/profile/" class="btn btn-outline-light btn-sm">My Profile</a>
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
</form>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
